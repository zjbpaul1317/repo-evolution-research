# Dependency and tooling manifest only. The Skill runs from its source directory;
# this project is not installable as a standalone Python package.

[project]
name = "repo-evolution-research"
version = "0.2.8"
description = "Research the technical evolution of a GitHub repository with an auditable evidence ledger."
readme = "README.md"
license = "MIT"
authors = [{name = "zjbpaul1317"}]
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5"]

[project.urls]
Repository = "https://github.com/zjbpaul1317/repo-evolution-research"
Issues = "https://github.com/zjbpaul1317/repo-evolution-research/issues"
Documentation = "https://github.com/zjbpaul1317/repo-evolution-research#readme"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "PyYAML>=6"]

[tool.pytest.ini_options]
pythonpath = ["skills/repo-evolution-research/scripts"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["rer"]
